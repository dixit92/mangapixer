<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MangaPixer</title>
  <!-- Theme before the first paint (1.40.0): applies this device's last appearance (the copy ThemeService keeps in
       localStorage) to <html> before the stylesheet and the app load, so a light theme never flashes dark first
       (styles.scss derives color-scheme from data-theme).
       The two lists must equal theme-vocabulary.ts (pinned by ThemeVocabularyPinTests). Unknown values -> dark / violet.
       Inline on purpose: the server sends no Content-Security-Policy; behind a proxy that forbids inline scripts the app
       still themes itself once it starts, only a moment later. -->
  <script>
    (function () {
      var bases = ['dark', 'light', 'black', 'sepia', 'system'];
      var accents = ['violet', 'blue', 'teal', 'green', 'amber', 'rose'];
      var theme = 'dark', accent = 'violet', root = document.documentElement;
      try {
        var t = localStorage.getItem('mangapixer-theme'), a = localStorage.getItem('mangapixer-accent');
        if (bases.indexOf(t) >= 0) theme = t;
        if (accents.indexOf(a) >= 0) accent = a;
      } catch (e) { /* no storage: defaults */ }
      if (theme === 'system') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-accent', accent);
    })();
  </script>
  <base href="/" />
  <!-- viewport-fit=cover: lets the installed (standalone) PWA lay out under the
       display cutout/gesture bars instead of being fit into a slightly-smaller
       safe area. Without it, some Android WebViews compute an initial layout
       viewport that doesn't quite match the visual viewport, which is read back
       as a spurious visualViewport.scale a hair above 1 (see ZoomedScaleThreshold
       in reader.component.ts) and can make the reader think the page is
       pinch-zoomed before the user has touched it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- iOS home-screen install (IPAD-FULLSCREEN): status-bar-style is "black" (opaque),
       not "black-translucent" - translucent lays the app out UNDER the status bar,
       which would need safe-area-inset padding across the whole shell. That's a
       bigger change than this patch takes on; "black" keeps today's layout. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="MangaPixer" />
  <meta name="theme-color" content="#121212" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body class="mat-app-background">
  <app-root></app-root>
</body>
</html>
