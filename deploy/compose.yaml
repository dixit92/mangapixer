# MangaPlex production Compose file (template)
# Real library mounts and app-data paths are supplied through ignored local overrides.
# Set MANGAPLEX_VERSION to pin the image tag; it falls back to 'latest' when unset.
# Loopback-only publication by default; reverse proxies handle external access.

services:
  mangaplex:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mangaplex:${MANGAPLEX_VERSION:-latest}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      MangaPlex__Storage__DataRoot: "/data"
      MangaPlex__Storage__CacheRoot: "/cache"
      MangaPlex__Storage__ScratchRoot: "/scratch"
    volumes:
      - mangaplex-data:/data
      - mangaplex-cache:/cache
      - mangaplex-scratch:/scratch
      # Media mounts are supplied through compose.override.yaml (ignored)
      # Source media is mounted read-only to enforce the read-only invariant
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    labels:
      org.opencontainers.image.title: "MangaPlex"
      org.opencontainers.image.description: "Folder-native comic/manga server and Angular web reader"
      org.opencontainers.image.version: "${MANGAPLEX_VERSION:-latest}"
      org.opencontainers.image.licenses: "MIT"

volumes:
  mangaplex-data:
  mangaplex-cache:
  mangaplex-scratch:
