# MangaPixer production Compose file (template)
# Real library mounts and app-data paths are supplied through ignored local overrides.
# Pulls the published image from GHCR. Set MANGAPIXER_VERSION to pin the tag;
# it falls back to 'latest' when unset. To build from source instead, add the
# compose.build.yaml overlay (see docs/install-docker.md, "Building from source").
# Loopback-only publication by default; reverse proxies handle external access.

services:
  mangapixer:
    image: ghcr.io/dixit92/mangapixer:${MANGAPIXER_VERSION:-latest}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      MangaPixer__Storage__DataRoot: "/data"
      MangaPixer__Storage__CacheRoot: "/cache"
      MangaPixer__Storage__ScratchRoot: "/scratch"
    volumes:
      - mangapixer-data:/data
      - mangapixer-cache:/cache
      - mangapixer-scratch:/scratch
      # Media mounts are supplied through compose.override.yaml (ignored)
      # Source media is mounted read-only to enforce the read-only invariant
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    labels:
      org.opencontainers.image.title: "MangaPixer"
      org.opencontainers.image.description: "Folder-native comic/manga server and Angular web reader"
      org.opencontainers.image.version: "${MANGAPIXER_VERSION:-latest}"
      org.opencontainers.image.licenses: "MIT"

volumes:
  mangapixer-data:
  mangapixer-cache:
  mangapixer-scratch:
