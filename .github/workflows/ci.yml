# Continuous integration: runs the Full verification tier and the end-to-end
# (browser) suite on every push to the trunks and on every pull request into dev.
#
# steps. Two independent jobs run in parallel:
#   - verify: `pwsh ./scripts/Verify.ps1 -Configuration Release` (privacy
#     preflight, locked restore, dotnet format, Release build, all .NET tests,
#     npm ci + lint + production build + Vitest unit tests, Compose validation).
#     Server-free and fast. See that script's header for the full ordered stages.
#   - e2e: `pwsh ./scripts/Verify-E2E.ps1` (build the image, run it on a free
#     loopback port with throwaway storage, provision the first admin, install
#     Chromium, run the Playwright suite). Kept separate so the fast unit tier is
#     never gated on container provisioning.
#
#   - notices: `web/scripts/check-notices-drift.mjs` compares the shipped sets in
#     THIRD-PARTY-NOTICES.md (sections 1 and 3) with a Release publish of the server
#     and worker and `npm ls --omit=dev`. Its own parallel job (publish + npm ci, no
#     tests), so it fails fast on a Dependabot bump without lengthening `verify`.
#
# Required status check names for branch protection: "Verify (Full tier)"
# (job id: verify) and "E2E (Playwright)" (job id: e2e); "Notices drift" (job id:
# notices) may be added once it has run green on dev.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; trunk pushes always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Product name used for artifact names. Single place to change on a rename.
  PRODUCT_NAME: mangapixer
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NG_CLI_ANALYTICS: "false"

jobs:
  verify:
    name: Verify (Full tier)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No packages.lock.json is tracked, so setup-dotnet's built-in cache cannot
      # key on it; central package versions live in Directory.Packages.props.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The 7z archive fixture tests skip themselves when 7z is not on PATH.
      # Make sure they run in CI.
      - name: Ensure 7-Zip for archive fixture tests
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          command -v 7z

      - name: Tool versions
        run: |
          dotnet --version
          node --version
          npm --version
          pwsh --version
          docker compose version

      # Verify.ps1 does not run Playwright (e2e needs a running instance), so no
      # browsers are installed here.
      - name: Verify (Full tier)
        run: |
          # pipefail so a Verify.ps1 failure is not masked by tee's exit code.
          set -o pipefail
          pwsh ./scripts/Verify.ps1 -Configuration Release 2>&1 | tee "$RUNNER_TEMP/verify-full.log"

      - name: Upload verification log and test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCT_NAME }}-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verify-full.log
            **/TestResults/
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # THIRD-PARTY-NOTICES.md drift check (shipped .NET set + web runtime set). Sections 2
  # and 4 (build/test sets) are not checked: section 4 is a Windows x64 install whose
  # platform binaries differ on Linux, and section 2 needs a test-project restore.
  notices:
    name: Notices drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Publish server and worker (Release)
        run: |
          dotnet publish src/MangaPixer.Server/MangaPixer.Server.csproj -c Release -o "$RUNNER_TEMP/publish/server"
          dotnet publish src/MangaPixer.MediaWorker/MangaPixer.MediaWorker.csproj -c Release -o "$RUNNER_TEMP/publish/worker"

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Check THIRD-PARTY-NOTICES.md against the build output
        run: node web/scripts/check-notices-drift.mjs --publish "$RUNNER_TEMP/publish/server" --publish "$RUNNER_TEMP/publish/worker"

  # End-to-end (browser) suite. Runs as its own job — independent of `verify` —
  # so the fast unit tier is not gated on building and provisioning a container.
  # This job re-implements nothing: it builds the image, runs it on a free
  # loopback port with throwaway storage, provisions the first admin, installs
  # Chromium, and runs the Playwright suite, all inside Verify-E2E.ps1.
  # Docker and pwsh are preinstalled on ubuntu-latest.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tool versions
        run: |
          node --version
          npm --version
          pwsh --version
          docker --version

      - name: E2E (build, provision, Playwright)
        run: |
          # pipefail so a Verify-E2E.ps1 failure is not masked by tee's exit code.
          set -o pipefail
          pwsh ./scripts/Verify-E2E.ps1 2>&1 | tee "$RUNNER_TEMP/verify-e2e.log"

      - name: Upload Playwright report and e2e log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCT_NAME }}-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verify-e2e.log
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
