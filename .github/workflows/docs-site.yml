# Documentation site: builds docs/ into https://mangapixer.com with MkDocs
# (mkdocs.yml, docs-site/) and publishes it with GitHub Pages.
#
#   build   every trigger: locked install (hashes), strict build (any warning,
#           broken link or missing anchor fails it), then the offline link and
#           third-party check (docs-site/check_links.py).
#   deploy  only for main (pushes and manual runs): main carries the docs of
#           the latest release, so the site always matches the released
#           version. dev pushes and pull requests into dev build only, to
#           catch breakage before the release cut.
#
# Pages must be set to "GitHub Actions" as its source, with the custom domain
# mangapixer.com (docs/CNAME carries the same name).

name: Docs site

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "mkdocs.yml"
      - "assets/screenshots/**"
      - "web/src/assets/icons/**"
      - "web/src/favicon.ico"
      - "Version.props"
      - ".github/workflows/docs-site.yml"
  pull_request:
    branches: [dev]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "mkdocs.yml"
      - "assets/screenshots/**"
      - "web/src/assets/icons/**"
      - "web/src/favicon.ico"
      - "Version.props"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  # A newer build of the same branch supersedes a queued one; a running deploy
  # is never cancelled half-way.
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install site tooling (locked, hash-checked)
        run: python -m pip install --require-hashes --no-deps -r docs-site/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Check links and third-party loads
        run: python docs-site/check_links.py site

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish the Pages deployment
      id-token: write   # OIDC token that deploy-pages uses to verify the artifact's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
