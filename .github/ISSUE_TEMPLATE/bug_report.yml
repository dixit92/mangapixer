name: Bug report
description: Something in MangaPlex does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security problems do not belong here.** Please report them privately as
        described in SECURITY.md.

        **Keep personal data out of this issue.** Do not paste real library paths,
        file or folder names from your collection, user names, IP addresses,
        passwords, or tokens. Replace them with placeholders such as `<library>`.

  - type: input
    id: version
    attributes:
      label: MangaPlex version
      description: Shown in the app footer, or returned by `GET /api/v1/system/info`.
      placeholder: "1.12.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How do you run MangaPlex?
      options:
        - Docker / Docker Compose
        - Unraid
        - Windows (standalone)
        - Built from source
        - Other (please describe below)
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Browser and device
      description: For example "Safari on iPad (iPadOS 26)" or "Firefox 140 on Windows 11".
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Screenshots help, but check that they show no personal data.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a library
        2. Select ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Server log lines around the time of the problem. MangaPlex logs are
        designed not to contain paths or titles, but read them before pasting.
        This field is rendered as a code block automatically.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this bug has not been reported yet.
          required: true
        - label: I removed personal data (paths, titles, names, addresses, credentials) from everything above.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
