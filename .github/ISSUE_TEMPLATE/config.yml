# Issue chooser: only the bug and feature forms are offered; everything else is
# routed to the links below.
blank_issues_enabled: false
contact_links:
  - name: Documentation
    url: https://github.com/dixit92/mangapixer/tree/dev/docs
    about: Installation, configuration, and usage guides.
  - name: Questions and ideas (Discussions)
    url: https://github.com/dixit92/mangapixer/discussions
    about: Ask for help or talk through an idea before filing a request.
  - name: Report a security vulnerability
    url: https://github.com/dixit92/mangapixer/security/advisories/new
    about: Report security problems privately. Please do not open a public issue.
